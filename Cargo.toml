[package]
name = "cache-cab"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "A resource-aware session cache experiment for local coding assistants"
publish = false
default-run = "cache-cab"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.7.9"
bytes = "=1.12.1"
gif = "=0.13.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.6.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.10", features = ["client-legacy", "http1", "tokio"] }
image = { version = "=0.25.5", default-features = false, features = ["png"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
syn = { version = "=2.0.119", features = ["full"] }
tempfile = "=3.15.0"
thiserror = "=2.0.11"
tokio = { version = "=1.44.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
